name: Checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - id: setup
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm audit

  packaged:
    # Keep per-push packaging off the constrained Apple Silicon runner pool.
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
      - run: pnpm package
      - run: pnpm test:packaged

  # Preserve the existing required check and fail if either job fails or skips.
  verify:
    if: ${{ always() }}
    needs: [portable, packaged]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          PACKAGED_RESULT: ${{ needs.packaged.result }}
        run: test "$PORTABLE_RESULT" = success && test "$PACKAGED_RESULT" = success
