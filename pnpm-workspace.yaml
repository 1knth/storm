allowBuilds:
  # Pi is installed for extension types; its provider SDK build scripts are unused.
  '@google/genai': false
  protobufjs: false
  electron: true
  electron-winstaller: true

nodeLinker: hoisted

overrides:
  'glob@>=9.0.0 <=14.0.1': 14.0.3
  'katex@>=0.11.0 <0.18.2': 0.18.10
  'minimatch@>=4 <11.0.1': 11.0.4
  'undici@>=6.0.0 <7.0.0': 6.29.1
  'undici@>=7.0.0 <8.0.0': 7.30.1

# GHSA-g3hv-75wg-m249 (minimatch <11.0.1 ReDoS) survives only under the
# electron-winstaller peer, whose bundled @electron/asar 3.x reaches it through
# glob@7. minimatch 11 exports an object rather than a callable, so forcing that
# range would break glob@7 and Windows installer creation. The override above
# patches every range that can be upgraded safely.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
